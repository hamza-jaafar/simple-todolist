<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }

      body {
        background: #eef2f7;
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Card wrapper */
      div {
        background: #ffffff;
        width: 100%;
        max-width: 560px;

        padding: 26px 30px;
        border-radius: 20px;

        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.07);
      }

      /* العنوان فالنص */
      h1 {
        text-align: center;
        font-weight: 700;
        font-size: 24px;
        color: #0f172a;
        letter-spacing: 0.3px;

        margin-bottom: 16px;
      }

      /* فورم على اليسار */
      form {
        text-align: left;
      }

      /* Todo row */
      .todo-row {
        display: flex;
        align-items: center;

        padding: 10px 12px;
        margin: 6px 0;

        border: 1px solid #e2e8f0;
        border-radius: 12px;

        transition: all 0.18s ease;
      }

      .todo-row:hover {
        background: #f8fafc;
        transform: translateX(3px);
        border-color: #cbd5e1;
      }

      /* Checkbox احترافي */
      input[type="checkbox"] {
        appearance: none;
        width: 22px;
        height: 22px;

        border: 2px solid #cbd5e1;
        border-radius: 7px;

        margin-right: 12px;
        cursor: pointer;
        position: relative;

        transition: all 0.2s ease;
      }

      input[type="checkbox"]:checked {
        background: #2563eb;
        border-color: #2563eb;
      }

      input[type="checkbox"]:checked::after {
        content: "✓";
        position: absolute;
        color: white;
        font-size: 14px;

        left: 4px;
        top: 0px;
      }

      /* النص */
      label {
        cursor: pointer;
        font-size: 15px;
        color: #1e293b;
      }

      /* زر submit */
      input[type="submit"] {
        width: 100%;
        background: #2563eb;
        color: white;

        border: none;
        padding: 12px 16px;
        border-radius: 14px;

        font-size: 16px;
        font-weight: 600;
        margin-top: 10px;

        cursor: pointer;
        transition: all 0.2s ease;
      }

      input[type="submit"]:hover {
        background: #1d4ed8;
        transform: translateY(-2px);
      }

      input[type="submit"]:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div>
      <h1>My Todo-List</h1>
      <form action="#">
        <div class="todo-row">
          <input type="checkbox" id="gym" />
          <label for="gym">Going to gym</label>
        </div>

        <div class="todo-row">
          <input type="checkbox" id="shooting" />
          <label for="shooting">shooting video at 10 Pm</label>
        </div>

        <div class="todo-row">
          <input type="checkbox" id="learn" />
          <label for="learn">Learn Programming</label>
        </div>

        <div class="todo-row">
          <input type="checkbox" id="eat" />
          <label for="eat">Eat Healthy</label>
        </div>

        <div class="todo-row">
          <input type="checkbox" id="meet" />
          <label for="meet">Job meeting with CEO</label>
        </div>

        <input type="submit" value="submit" />
      </form>
    </div>
  </body>
</html>
